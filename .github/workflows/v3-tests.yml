name: BTC Pro V3 Tests
on:
  push:
    branches:
      - btc-pro-v3-live-chart-callouts
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q intelligence scanner.py dashboard.py windows_setup.py
      - name: Run unit tests without real trading
        run: python -m unittest discover -s tests -v
